<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDEALTECH - Consulta de Ordem de Serviço</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    .brand {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .brand .ideal {
      color: #ffffff;
    }
    .brand .tech {
      color: #3b82f6;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: #0f172a;
      color: #fff;
      font-size: 16px;
      text-align: center;
      outline: none;
      text-transform: uppercase;
      transition: border-color 0.2s;
      letter-spacing: 1px;
      font-family: 'Consolas', 'Courier New', monospace;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
    }
    button {
      padding: 14px;
      border-radius: 8px;
      border: none;
      background-color: #0284c7;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0369a1;
    }
    button:disabled {
      background-color: #334155;
      cursor: not-allowed;
    }
    .btn-back {
      display: inline-block;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background-color: transparent;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-back:hover {
      background-color: #334155;
      color: #fff;
      border-color: #64748b;
    }
    .error-msg {
      color: #f87171;
      font-size: 13px;
      margin-top: 14px;
      display: none;
      background: rgba(248, 113, 113, 0.1);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid rgba(248, 113, 113, 0.2);
    }
    .hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 20px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="brand"><span class="ideal">IDEAL</span><span class="tech">TECH</span></div>
    <div class="subtitle">Gestão e Tecnologia • Portal da OS</div>

    <form class="form-group" onsubmit="buscarOS(event)">
      <input type="text" id="osInput" placeholder="Ex: 260809KHDH" required autofocus autocomplete="off" />
      <button type="submit" id="btnSubmit">Acessar Ordem de Serviço</button>
    </form>

    <div id="errorMsg" class="error-msg">Ordem de Serviço não encontrada. Verifique o código e tente novamente.</div>

    <div class="hint">Digite o código recebido no seu comprovante para visualizar o status do serviço.</div>

    <a href="https://idealtech.srv.br" class="btn-back">← Voltar para o Início</a>
  </div>

  <script>
    async function buscarOS(event) {
      event.preventDefault();
      const input = document.getElementById('osInput');
      const errorMsg = document.getElementById('errorMsg');
      const btnSubmit = document.getElementById('btnSubmit');

      errorMsg.style.display = 'none';

      // Remove '#' e espaços, mantém maiúsculas/minúsculas originais
      let codigoBusca = input.value.trim().replace(/#/g, '').toUpperCase();

      if (!codigoBusca) return;

      btnSubmit.innerText = 'Buscando...';
      btnSubmit.disabled = true;

      try {
        // Tenta localizar o arquivo via API do GitHub
        const response = await fetch('https://api.github.com/repos/idealtechget-web/OS_ERP/contents/');
        if (!response.ok) throw new Error('API GitHub indisponível');

        const arquivos = await response.json();
        const arquivoEncontrado = arquivos.find(item =>
          item.name.toLowerCase().endsWith('.html') &&
          item.name.toUpperCase().includes(codigoBusca)
        );

        if (arquivoEncontrado) {
          // Redireciona para o nome exato do arquivo
          window.location.href = arquivoEncontrado.name;
          return;
        }
      } catch (err) {
        console.warn('Fallback ativado (API falhou):', err);
      }

      // FALLBACK: tenta redirecionar diretamente para codigoBusca + '.html'
      // NÃO usar toLowerCase() – mantém a capitalização original
      const destino = codigoBusca + '.html';
      // Verifica se o arquivo existe (opcional) – tentar fetch
      try {
        const testResponse = await fetch(destino, { method: 'HEAD' });
        if (testResponse.ok) {
          window.location.href = destino;
          return;
        }
      } catch (_) {
        // Se falhar, mostra erro
      }

      // Se chegou aqui, não encontrou
      errorMsg.style.display = 'block';
      btnSubmit.innerText = 'Acessar Ordem de Serviço';
      btnSubmit.disabled = false;
    }
  </script>

</body>
</html>
